name: Feature request
description: An idea for something new, or a way to make something better.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or need behind the idea. What are you trying to get done?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working. Sketches or examples from other apps are welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Editor, Notes and notebooks, Search, Sync and devices, Media, Tasks and calendar, Whiteboard, Plugins, Settings and appearance, Mobile, Other]
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [All, Windows, Linux, Android, Web]
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Any workaround you use now.
