name: Question or help
description: Not sure how something works, or need help setting it up.
title: "[Question]: "
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Windows, Linux, Android, Web, Other]
